[project]
name = "policyguard"
version = "0.1.0"
description = "Policy alignment classifier and guarded agent harness"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
policyguard = "policyguard.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policyguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
